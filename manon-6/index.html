:root{color-scheme:dark}
html,body{background:#000000;margin:0}
.rv{opacity:0;transform:translateY(34px) scale(.96);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.rvd{opacity:1;transform:none}
.hero img{will-change:transform;transform-origin:50% 0}
.hero .cap{will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

#pg-manon-facebook-a .lp{position:relative;min-height:100%;background:#000000;color:#ffffff;font-family:Inter,Manrope,system-ui,-apple-system,sans-serif;display:flex;justify-content:center;isolation:isolate}
#pg-manon-facebook-a .lp *{box-sizing:border-box}
#pg-manon-facebook-a .lp .bgb{position:fixed;inset:-60px;z-index:-1;background-size:cover;background-position:center;filter:blur(48px) brightness(.7) saturate(1.2);transform:scale(1.1)}
#pg-manon-facebook-a .lp .in{position:relative;width:100%;max-width:566px;display:flex;flex-direction:column;align-items:center;padding:0 0 28px;background:#000000;min-height:100%}
@media (min-width:640px){#pg-manon-facebook-a .lp{padding-top:34px}#pg-manon-facebook-a .lp .in{border-radius:30px 30px 0 0;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}}
#pg-manon-facebook-a .lp .hero{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden}
#pg-manon-facebook-a .lp .hero img{width:100%;height:100%;object-fit:cover;display:block}
#pg-manon-facebook-a .lp .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000000 12%,#00000057 46%,#000000d1 76%,#000000 100%)}
#pg-manon-facebook-a .lp .hero .cap{position:absolute;left:0;right:0;bottom:16px;z-index:1;text-align:center;padding:0 18px}
#pg-manon-facebook-a .lp .hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 18px 0}
#pg-manon-facebook-a .lp .av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:750;background:#161616;color:#ffffff}
#pg-manon-facebook-a .lp h1{font-size:32px;font-weight:750;letter-spacing:.25px;line-height:1.25;margin:0;text-wrap:balance}
#pg-manon-facebook-a .lp .hl{margin:2px 0 0;color:#ffffff;opacity:.75;font-weight:500;font-size:14px}
#pg-manon-facebook-a .lp .soc{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:12px}
#pg-manon-facebook-a .lp .sb{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
#pg-manon-facebook-a .lp .sb .bd{width:38px;height:38px}
#pg-manon-facebook-a .lp .sb:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
#pg-manon-facebook-a .lp .ph-hero{background:linear-gradient(180deg,#2b2b30 0%,#121214 60%,#000000 100%)}
#pg-manon-facebook-a .lp .ph-hero .phc{position:absolute;inset:0 0 30% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.7);font-weight:600;font-size:15px}
#pg-manon-facebook-a .lp .bio{margin:12px auto 0;color:#ffffff;font-size:14px;line-height:1.3;max-width:40ch;text-wrap:balance;text-align:center}
#pg-manon-facebook-a .lp .ls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:16px 0 0;padding:0 16px;list-style:none}
#pg-manon-facebook-a .lp .ls li{grid-column:span 2;min-width:0}
#pg-manon-facebook-a .lp .ls li.half{grid-column:span 1}
#pg-manon-facebook-a .lp .b{position:relative;width:100%;border:0;background:#161616;color:#ffffff;font:600 16px Inter,Manrope,sans-serif;cursor:pointer;padding:0;border-radius:12px;overflow:hidden;transition:transform .15s ease,filter .15s ease;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pg-manon-facebook-a .lp .b img{-webkit-user-drag:none;pointer-events:none}
#pg-manon-facebook-a .lp .b:hover{filter:brightness(1.08)}
#pg-manon-facebook-a .lp .b:active{transform:scale(.985)}
#pg-manon-facebook-a .lp .b:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
#pg-manon-facebook-a .lp .bd{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#pg-manon-facebook-a .lp .bd .bi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
#pg-manon-facebook-a .lp .bd .bi svg{width:20px;height:20px}
#pg-manon-facebook-a .lp .bd.bl{background:none;box-shadow:none}
#pg-manon-facebook-a .lp .bd.bl svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
/* Grande carte (format paysage comme link.me), titre en bas */
#pg-manon-facebook-a .lp .b.big{display:block;aspect-ratio:538/326}
#pg-manon-facebook-a .lp .b.big img,#pg-manon-facebook-a .lp .b.big .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-size:56px;font-weight:750;background:#222222}
#pg-manon-facebook-a .lp .b.big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,6,35,0) 0%,rgba(6,13,18,.6) 128.76%)}
#pg-manon-facebook-a .lp .b.big .bd{position:absolute;top:9px;left:7px;z-index:1}
#pg-manon-facebook-a .lp .b.big .tx{position:absolute;left:0;right:0;bottom:5px;z-index:1;text-align:center;color:#fff;font-size:18px;font-weight:600;line-height:1.3;padding:0 12px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
#pg-manon-facebook-a .lp .b.big.med{aspect-ratio:2/1}
#pg-manon-facebook-a .lp .b.big.half{aspect-ratio:166/106;border-radius:15px}
#pg-manon-facebook-a .lp .b.big.half .bd{width:22px;height:22px;top:7px;left:7px}
#pg-manon-facebook-a .lp .b.big.half .bd .bi{width:18px;height:18px}
#pg-manon-facebook-a .lp .b.big.half .bd .bi svg{width:12px;height:12px}
#pg-manon-facebook-a .lp .b.big.half .bd.bl svg{width:22px;height:22px}
#pg-manon-facebook-a .lp .b.big.half .tx{font-size:14px;bottom:5px;padding:0 8px}
#pg-manon-facebook-a .lp .b.big.half .ph{font-size:40px}
/* Petite : image à gauche, titre centré */
#pg-manon-facebook-a .lp .b.row{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;padding:7px;text-align:center}
#pg-manon-facebook-a .lp .b.row img,#pg-manon-facebook-a .lp .b.row .ph{width:56px;height:56px;border-radius:9px;object-fit:cover;display:grid;place-items:center;font-size:20px;font-weight:750;background:#222222}
#pg-manon-facebook-a .lp .b.row .tx{overflow-wrap:anywhere;line-height:1.3}
#pg-manon-facebook-a .lp .fol{margin-top:14px;font-size:17px;font-weight:400;display:inline-flex;align-items:center;gap:6px;color:#ffffff}
#pg-manon-facebook-a .lp .fol b{font-weight:700}
#pg-manon-facebook-a .lp .fol svg{width:18px;height:18px}
#pg-manon-facebook-a .lp .b.sect{background:none;border-radius:0;font-size:17px;font-weight:800;text-transform:uppercase;text-align:center;padding:16px 8px 2px;cursor:default;line-height:1.25;letter-spacing:.2px;overflow:visible}
#pg-manon-facebook-a .lp .b.sect:hover{filter:none}#pg-manon-facebook-a .lp .b.sect:active{transform:none}
#pg-manon-facebook-a .lp .ft{margin-top:22px;font-size:12px;color:#9a9a9a;opacity:.7}
@media (prefers-reduced-motion:reduce){#pg-manon-facebook-a .lp .b{transition:none}}
#pg-manon-facebook-a .lp{min-height:100vh;min-height:100dvh}#pg-manon-facebook-a .lp .in{min-height:100vh;min-height:100dvh}#pg-manon-facebook-a a.b,#pg-manon-facebook-a a.sb{text-decoration:none;color:inherit}#pg-manon-facebook-a a.b.big,#pg-manon-facebook-a a.b.sect{display:block}#pg-manon-facebook-a .mini .mi{background:linear-gradient(180deg,#000000f2,#00000000);color:#ffffff}@media (prefers-reduced-motion:no-preference){#pg-manon-facebook-a .ls li:first-child .b.big:not(.half)::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-60%;width:36%;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:lmShine 4.2s ease-in-out 1s infinite}}
.mini{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .25s ease,transform .25s ease}
.mini.on{opacity:1;transform:none}
.mini .mi{width:100%;max-width:614px;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 14px;font:600 16px Inter,system-ui,sans-serif}
.mini img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
@keyframes lmShine{0%,55%{left:-60%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){.mini{transition:none}}
